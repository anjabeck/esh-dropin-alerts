name: Weekly summary

on:
  schedule:
    - cron: "0 1 * * MON"   # every Sunday at 8pm EST
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python script.py weekly
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
